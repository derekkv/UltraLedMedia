server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Activos con hash: caché larga
    location ~* \.(js|css|woff2?|png|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA manifest: sin caché
    location /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Proxy de la API (evita CORS y mezcla orígenes)
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        # Permite subir archivos adjuntos de clientes (debe ser >= UPLOAD_MAX_BYTES).
        client_max_body_size 30m;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback (TanStack Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
