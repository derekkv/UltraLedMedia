services:
  postgres:
    image: postgres:17-alpine
    container_name: ultraled-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ultraled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-ultraled}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultraled} -d ${POSTGRES_DB:-ultraled}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ultraled-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ultraled-api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV:              production
      PORT:                  3000
      DATABASE_URL:          postgresql://${POSTGRES_USER:-ultraled}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ultraled}?schema=public
      REDIS_URL:             redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET:        ${SESSION_SECRET}
      SESSION_COOKIE_NAME:   ${SESSION_COOKIE_NAME:-ultraled_sid}
      SESSION_IDLE_TTL:      ${SESSION_IDLE_TTL:-1800}
      SESSION_ABSOLUTE_TTL:  ${SESSION_ABSOLUTE_TTL:-43200}
      CORS_ORIGINS:          ${CORS_ORIGINS}
      ADMIN_EMAIL:           ${ADMIN_EMAIL}
      ADMIN_PASSWORD:        ${ADMIN_PASSWORD}
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ultraled-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data:
